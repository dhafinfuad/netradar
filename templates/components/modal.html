{% macro modal(id, title, form_action='', form_method='POST') %}
<div id="{{ id }}" class="fixed inset-0 z-50 hidden overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
        
        <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true" onclick="document.getElementById('{{ id }}').classList.add('hidden')"></div>
        <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

        <div class="inline-block bg-white dark:bg-gray-800 rounded-xl text-left overflow-hidden shadow-2xl transform transition-all my-6 align-middle max-w-[92%] sm:max-w-md w-full">
            {% if form_action %}
            <form action="{{ form_action }}" method="{{ form_method }}">
            {% endif %}
                <div class="bg-white dark:bg-gray-800 px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    {% if title %}
                    <h3 class="text-lg leading-6 font-medium text-gray-900 dark:text-white mb-4">{{ title }}</h3>
                    {% endif %}
                    
                    {{ caller() }}
                </div>
            {% if form_action %}
            </form>
            {% endif %}
        </div>
    </div>
</div>
{% endmacro %}
